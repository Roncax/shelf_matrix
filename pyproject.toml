[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf-matrix"
version = "0.1.0"
description = "LED matrix program server and Raspberry Pi client"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = ["tomli; python_version<'3.11'"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
client = ["websockets>=12", "pillow>=9"]
dev = ["shelf-matrix[server,client]", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["shelf_matrix*"]

[tool.setuptools.package-data]
shelf_matrix = ["server/static/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
